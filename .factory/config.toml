# Klobuk configuration (committed). Unknown sections are ignored.
# Dogfooding: Klobuk builds Klobuk. Local merges; workers on sonnet with a 10 USD cap per issue.
# The issue prefix stays `asf` in this repository: the ids are part of its history.

[repo]
prefix = "asf"
default_branch = "main"
worktrees_dir = ".worktrees"

[scheduler]
max_parallel = 2
hotspots = ["Cargo.toml", "Cargo.lock", "crates/klobuk-core/src/ports.rs"]

[store]
auto_export = true
export_comments = true

[ui]
language = "en"

[methodology]
name = "klobuk-default"

[worker]
runtime = "herdr"
model = "sonnet"
budget_usd = 10
stall_minutes = 15
max_wall_minutes = 90
max_tool_calls = 400
start_timeout_ms = 180000  # Herdr reports the Claude pane idle later than 90 s on this machine (asf-8/12/20/21)
# Workers: no gh (merges and GitHub are the orchestrator's job), no cat/dir (Read/Glob cover it),
# cargo limited to build/check/fmt/clippy/test, rtk only for the ls rewrite the user's hook applies.
allowed_tools = ["Read", "Edit", "Write", "Glob", "Grep", "Bash(git *)", "Bash(klobuk *)", "Bash(cargo build *)", "Bash(cargo check *)", "Bash(cargo fmt *)", "Bash(cargo clippy *)", "Bash(cargo test *)", "Bash(ls *)", "Bash(rtk ls *)"]
deny = ["Read(./.env)", "Read(./.env.*)", "Read(**/secrets/**)", "Bash(git push *)", "Bash(git remote *)", "Bash(rtk proxy *)", "Bash(cargo install *)", "Bash(cargo run *)", "Bash(* .env*)", "Bash(*secrets*)"]
permission_mode = "auto"  # no permission prompts: the classifier decides, deny rules still win
auto_trust = true
pre_trust = false

[[gate]]
name = "fmt"
cmd = ["cargo", "fmt", "--all", "--", "--check"]
timeout_s = 120

[[gate]]
name = "clippy"
cmd = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
timeout_s = 900

[[gate]]
name = "test"
cmd = ["cargo", "test", "--workspace"]
timeout_s = 2700
# no early slow-test stop (slow_tests / slow_after_s): on 2026-11-14 it cut six healthy runs and no hung one; the timeout is the guard

[merge]
target = "local"
require_clean_main = true
verify_main_after = false  # off 2026-11-13: after a fast-forward main is the tree the queue gates just passed

[review]
required = true
on_labels = []
max_rounds = 3

[planner]
runner = "claude"
model = "opus"
budget_usd = 5
