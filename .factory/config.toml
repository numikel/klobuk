# auto-software-factory configuration (committed). Unknown sections are ignored.
# Dogfooding: asf builds asf. Local merges; workers on sonnet with a 5 USD cap per issue.

[repo]
prefix = "asf"
default_branch = "main"
worktrees_dir = ".worktrees"

[scheduler]
max_parallel = 2
hotspots = ["Cargo.toml", "Cargo.lock", "crates/asf-core/src/ports.rs"]

[store]
auto_export = true
export_comments = true

[ui]
language = "en"

[methodology]
name = "asf-default"

[worker]
runtime = "herdr"
model = "sonnet"
budget_usd = 5.0
stall_minutes = 15
max_wall_minutes = 90
max_tool_calls = 400
# Workers: no gh (merges and GitHub are the orchestrator's job), no cat/dir (Read/Glob cover it),
# cargo limited to build/check/fmt/clippy/test, rtk only for the ls rewrite the user's hook applies.
allowed_tools = ["Read", "Edit", "Write", "Glob", "Grep", "Bash(git *)", "Bash(asf *)", "Bash(cargo build *)", "Bash(cargo check *)", "Bash(cargo fmt *)", "Bash(cargo clippy *)", "Bash(cargo test *)", "Bash(ls *)", "Bash(rtk ls *)"]
deny = ["Read(./.env)", "Read(./.env.*)", "Read(**/secrets/**)", "Bash(git push *)", "Bash(git remote *)", "Bash(rtk proxy *)", "Bash(cargo install *)", "Bash(cargo run *)", "Bash(* .env*)", "Bash(*secrets*)"]
permission_mode = "auto"  # no permission prompts: the classifier decides, deny rules still win
auto_trust = true
pre_trust = false

[[gate]]
name = "fmt"
cmd = ["cargo", "fmt", "--all", "--", "--check"]
timeout_s = 120

[[gate]]
name = "clippy"
cmd = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-D", "warnings"]
timeout_s = 900

[[gate]]
name = "test"
cmd = ["cargo", "test", "--workspace"]
timeout_s = 1200

[merge]
target = "local"
require_clean_main = true
verify_main_after = true  # gates on main after every merge (dogfooding round 2)

[review]
required = false
on_labels = []

[planner]
runner = "claude"
model = "claude-haiku-5-5"
budget_usd = 1.0
