# GitHub spec-kit (MIT): /speckit.specify -> /speckit.plan -> /speckit.tasks produce
# specs/<nnn-feature>/tasks.md. klobuk imports that file: `klobuk plan import specs/<n>/tasks.md`
# (format is auto-detected; `--format spec-kit` forces it).

[methodology]
name = "spec-kit"
version = "0.1.0"
language = "en"
description = "Spec-driven development with GitHub spec-kit; klobuk imports specs/*/tasks.md."

[[stage]]
id = "tasks"
title = "Write tasks.md with spec-kit"
kind = "external"
runner = "interactive"
inputs = ["specs/*/spec.md", "specs/*/plan.md"]
outputs = ["specs/*/tasks.md"]
parser = "builtin:spec-kit-tasks"

[issue_defaults]
labels = ["spec-kit"]
