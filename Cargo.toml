[workspace]
resolver = "2"
members = ["crates/klobuk-core", "crates/klobuk-store", "crates/klobuk-vcs", "crates/klobuk-runtime", "crates/klobuk"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/numikel/klobuk"
homepage = "https://github.com/numikel/klobuk"
keywords = ["claude-code", "ai-agents", "git-worktree", "automation", "orchestration"]
rust-version = "1.85"

[workspace.dependencies]
# Release bump: change `version` here and in [workspace.package]; crates inherit both.
klobuk-core = { version = "0.1.1", path = "crates/klobuk-core" }
klobuk-store = { version = "0.1.1", path = "crates/klobuk-store" }
klobuk-vcs = { version = "0.1.1", path = "crates/klobuk-vcs" }
klobuk-runtime = { version = "0.1.1", path = "crates/klobuk-runtime" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
toml = "1.1"
toml_edit = "0.25"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
ulid = "3.0"
globset = "0.4"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.41", features = ["bundled"] }
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30"

# dev
tempfile = "3.27"
assert_cmd = "2.2"
predicates = "3.1"
proptest = "1.12"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
