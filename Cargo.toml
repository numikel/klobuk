[workspace]
resolver = "2"
members = ["crates/asf-core", "crates/asf-store", "crates/asf-vcs", "crates/asf-runtime", "crates/asf"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
asf-core = { path = "crates/asf-core" }
asf-store = { path = "crates/asf-store" }
asf-vcs = { path = "crates/asf-vcs" }
asf-runtime = { path = "crates/asf-runtime" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
toml = "1.1"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
ulid = "3.0"
globset = "0.4"
rusqlite = { version = "0.41", features = ["bundled"] }
clap = { version = "4.6", features = ["derive"] }

# dev
tempfile = "3.27"
assert_cmd = "2.2"
predicates = "3.1"
proptest = "1.12"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
